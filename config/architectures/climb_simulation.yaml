name: climb_simulation
display_name: Climb simulation
frequency_in_corpus: 2

intent: >
  A short ramp up into a harder finish, repeated across several "climbs" of
  varying length/cadence, each separated by a descent-style recovery.
  Distinct from a plain ramp because the ramp is always followed by a short,
  harder punch at the top — it simulates cresting a climb, not just a
  progressive effort.

rep_shape: climb_simulation
set_shape: identical

applicable_classes: [threshold, supra_threshold, vo2max, anaerobic]
disciplines: [trainer, road_bike, mtb, road_run, trail_run, treadmill]

progression_levers: [reps, bout_duration, intensity]

notes: >
  Low frequency in the cycling corpus likely reflects that most "climb"
  workouts on those platforms are tagged as over_unders or stepped_build.
  In running it is central: hill repeats appear in Hudson & Fitzgerald,
  Palladino, Rosario/Fitzgerald and Olbrich. For running the "climb" is the
  terrain itself (or the treadmill incline), not a ramp in the target: N x
  (uphill rep / jog or walk back down). Say "uphill" / "subida" / "incline"
  in the step cue — the engine can only recognise this shape from that word,
  because the target alone looks like any other interval.

combinable: [standalone, finisher]

example_shapes:
  - "N x (ramp up / short hard punch at the top / easy descent), repeated"

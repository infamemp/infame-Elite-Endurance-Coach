# Decision Thresholds — Infame Elite Endurance Coach v6
# Conforms to config/schema/thresholds.schema.json
#
# Cross-cutting rules that are NOT properties of any single author.
# Nothing here may be duplicated in the prompt, the engine, or the validator —
# all three read from this file. Zero magic numbers outside config/.

# ══════════════════════════════════════════════════════════════════
# OUTPUT FORMATS — how each metric is written in Intervals.icu syntax
# ══════════════════════════════════════════════════════════════════
# The zone tables document ranges as "% FTP" for readability. That label is
# documentation, not syntax. What gets emitted in a workout block is defined here.
# The validator rejects any target that does not match its metric's `syntax` form.

output_formats:
  power:
    syntax: "%"                    # e.g. "85-95%" — bare percentage, no suffix
    table_label: "% FTP"
    forbidden_suffixes: ["FTP", "CP", "W", "watts"]
    note: Power is emitted as a standalone percentage. Never append FTP or CP.

  lthr:
    syntax: "% LTHR"               # e.g. "85-90% LTHR"
    table_label: "% LTHR"
    forbidden_suffixes: ["HR", "HRmax", "bpm"]
    note: Heart rate is always expressed as % LTHR, never % HR or % HRmax.

  pace:
    syntax: "% Pace"               # e.g. "80-85% Pace"
    table_label: "% Threshold Pace"
    forbidden_suffixes: ["min/km", "min/mi", "/km", "/mile"]
    note: Pace is always relative to threshold pace. Never emit absolute pace.

  hrmax:
    syntax: null                   # never emitted — see special_output_rule per author
    table_label: "% HRmax"
    note: >
      % HRmax is a documentation-only metric. Any author whose native metric is
      % HRmax must declare a special_output_rule substituting an emittable metric.

# ══════════════════════════════════════════════════════════════════
# PRESCRIPTION FLOORS — minimum intensity that may be prescribed
# ══════════════════════════════════════════════════════════════════
# Author zone tables preserve the source faithfully, including open lower bounds
# ("< 55%"). Those bounds describe where the zone *begins*, not what may be
# *prescribed*. A target at or near zero causes execution problems — an ERG
# trainer drops to no resistance, and a device cannot steer a near-zero target.
#
# The generator renders open lower bounds using these floors, so the tables the
# coach and the model read already show the usable range. The validator rejects
# any emitted target below the floor for its metric.

prescription_floors:
  power: 25       # % FTP — avoids zero-resistance ERG behavior
  lthr: 50        # % LTHR — below this is below resting heart rate territory
  pace: 40        # % threshold pace
  hrmax: 40       # % HRmax — near resting heart rate

# ══════════════════════════════════════════════════════════════════
# RAMP ELIGIBILITY
# ══════════════════════════════════════════════════════════════════
# Ramp steps depend on the discipline and the metric, not on the methodology.
# A ramp requires a device that can steer a continuously changing target, which
# in practice means a smart trainer under power control.
#
# Resolution order:
#   1. If the athlete or coach explicitly sets ramps_allowed for a discipline
#      in the intake, that decision wins.
#   2. Otherwise a ramp is permitted only when the discipline appears in
#      allowed_disciplines AND the session metric appears in required_metrics.

ramps:
  # Ramps require a device that can steer a continuously changing target.
  allowed_disciplines: [trainer, indoor, rodillo]
  required_metrics: [power]

  # Treadmill CAN steer a changing target — speed and gradient adjust
  # progressively, the same way a smart trainer adjusts resistance. It is not
  # forbidden, only off by default: a ramp on a moving belt asks the athlete to
  # physically accelerate, which is a different demand from a resistance ramp.
  # Enable per athlete via ramp_overrides.treadmill_ramps_requested in
  # config/athletes/<id>.yaml.
  override_eligible:
    treadmill:
      requires: athlete_profile_flag
      flag: ramp_overrides.treadmill_ramps_requested
      permitted_metrics: [pace, lthr]

  # Device cannot steer a changing target outdoors. Not overridable.
  forbidden_disciplines: [road, mtb, gravel, run, trail]

  athlete_override_permitted: true
  no_magnitude_limit: >
    No cap is placed on ramp duration or delta. A progressive ramp test is a
    legitimate protocol, and any numeric ceiling would prohibit it. Magnitude is
    the coach's judgement.

# ══════════════════════════════════════════════════════════════════
# TSS COMPUTATION RULES
# ══════════════════════════════════════════════════════════════════
# Resolves the ambiguities that made v5.1 TSS estimates vary between runs.
# Multipliers live in config/tss_classes.yaml; these are the procedural rules.

tss_rules:
  range_cost_point: midpoint        # midpoint | low | high — how a target range is costed
  ramp_cost_point: midpoint         # a ramp is costed at the midpoint of its start/end
  repeats_multiply: true            # a repeat block multiplies its steps by the count
  count_recovery_intervals: true    # recovery steps inside repeats are costed, not skipped
  straddling_range_rule: midpoint_class
  # When a range spans two physiological classes, the class containing the
  # midpoint governs the whole step. No blending.
  distance_steps: unverifiable
  # Distance-based steps (2km, 500mtr) have no duration until the athlete's pace
  # is known. They are excluded from the computed total and reported explicitly.
  rounding: nearest_integer
  divergence_tolerance_pct: 10
  # Maximum permitted gap between a declared and a recomputed session TSS.

# ══════════════════════════════════════════════════════════════════
# CLASSIFICATION CUTPOINTS
# ══════════════════════════════════════════════════════════════════
# Disjoint semi-open intervals [min, max) used to classify an intensity target
# into a physiological class. Derived from the class boundaries the authors
# themselves declare, not invented: cycling power is verified against Coggan,
# Friel and Carmichael (14/14 zones agree); running power comes entirely from
# Palladino (9/9); % LTHR reflects a six-author consensus on the sub-threshold
# to threshold boundary at 95%; % HRmax comes from Olbrich, the only author
# defining it.
#
# PRECEDENCE — this matters more than the numbers themselves:
#   1. The physiological_class assigned to a zone in config/authors/*.yaml is
#      AUTHORITATIVE. When a target falls inside a declared zone of the active
#      methodology, that zone's class governs and these cutpoints are not used.
# Above threshold the scale splits three ways, following the authors' own zone
# names: VO2max, anaerobic capacity, and neuromuscular power. Boundaries come from
# where Coggan, Friel and Palladino place those transitions.
#
#   2. These cutpoints apply only as a fallback, when a target matches no
#      declared zone — e.g. the validator costing "85-95%" emitted in a block.
#
# Authors genuinely disagree: Friel Zone 5a is supra at 100-102% LTHR while
# Coggan Level 4 is still threshold up to 105%. No single set of cutpoints can
# satisfy both, which is precisely why author class wins. 67 of 78 zones agree
# with these cutpoints; the 11 that diverge are author disagreements, not errors.
#
# Palladino and Olbrich define no tempo zone. That gap is preserved rather than
# invented: under running power, 75-88% is endurance per Palladino.

classification_cutpoints:
  cycling:
    power:
      recovery:      {min: 0,   max: 55}
      endurance:     {min: 55,  max: 75}
      tempo:         {min: 75,  max: 88}
      sub_threshold: {min: 88,  max: 95}
      threshold:     {min: 95,  max: 106}
      vo2max:        {min: 106, max: 121}
      anaerobic:     {min: 121, max: 150}
      neuromuscular: {min: 150, max: null}
    lthr:
      recovery:      {min: 0,   max: 80}
      endurance:     {min: 80,  max: 88}
      tempo:         {min: 88,  max: 92}
      sub_threshold: {min: 92,  max: 95}
      threshold:     {min: 95,  max: 103}
      vo2max:        {min: 103, max: 107}
      anaerobic:     {min: 107, max: 112}
      neuromuscular: {min: 112, max: null}
  running:
    power:
      recovery:      {min: 0,   max: 75}
      endurance:     {min: 75,  max: 88}
      sub_threshold: {min: 88,  max: 95}
      threshold:     {min: 95,  max: 101}
      vo2max:        {min: 101, max: 116}
      anaerobic:     {min: 116, max: 150}
      neuromuscular: {min: 150, max: null}
    lthr:
      recovery:      {min: 0,   max: 80}
      endurance:     {min: 80,  max: 88}
      tempo:         {min: 88,  max: 92}
      sub_threshold: {min: 92,  max: 95}
      threshold:     {min: 95,  max: 103}
      vo2max:        {min: 103, max: 107}
      anaerobic:     {min: 107, max: 112}
      neuromuscular: {min: 112, max: null}
    pace:
      recovery:      {min: 0,   max: 75}
      endurance:     {min: 75,  max: 85}
      tempo:         {min: 85,  max: 91}
      sub_threshold: {min: 91,  max: 97}
      threshold:     {min: 97,  max: 103}
      vo2max:        {min: 103, max: 115}
      anaerobic:     {min: 115, max: 150}
      neuromuscular: {min: 150, max: null}
    hrmax:
      recovery:      {min: 0,   max: 75}
      endurance:     {min: 75,  max: 80}
      sub_threshold: {min: 80,  max: 85}
      threshold:     {min: 85,  max: 90}
      vo2max:        {min: 90,  max: 95}
      anaerobic:     {min: 95,  max: 100}
      neuromuscular: {min: 100, max: null}

class_resolution:
  order: [author_zone, cutpoints]
  note: >
    Resolve an intensity target against the active methodology's zones first.
    Fall back to classification_cutpoints only when no declared zone contains it.

# ══════════════════════════════════════════════════════════════════
# ATHLETE STATE RESOLUTION  (Stage 4 — not yet consumed)
# ══════════════════════════════════════════════════════════════════
# TSB is the primary governor. HRV is secondary and applies only where TSB is
# absent. ACWR acts as a validation gate that can downgrade a severe reading.

state_resolution:
  tsb_bands:
    maladaptation_risk: {max: -30}
    functional_overreach: {min: -30, max: -20}
    load_pressure: {min: -20, max: -10}
    neutral: {min: -10, max: 10}
    fresh: {min: 10}

  acwr_safe_range: {min: 0.8, max: 1.3}
  # Within this range, a maladaptation_risk reading accompanied by stable
  # durability is downgraded to functional_overreach.

  hrv_bands:
    suppressed: {max: 0.90}         # ratio to baseline
    normal: {min: 0.90, max: 1.10}
    elevated: {min: 1.10}

  operational_states: [recovery_priority, load_accepting]

# ══════════════════════════════════════════════════════════════════
# TAPER GOVERNANCE  (Stage 4 — not yet consumed)
# ══════════════════════════════════════════════════════════════════

taper:
  # Volume, duration, intensity and frequency parameters come from:
  #   Bosquet L, Montpetit J, Arvisais D, Mujika I. Effects of Tapering on
  #   Performance: A Meta-Analysis. Med Sci Sports Exerc. 2007;39(8):1358-1365.
  #   27 studies of competitive athletes.

  optimal_duration_days: 14
  duration_range_days: {min: 8, max: 14}
  # 8-14 d carries the largest effect (0.59). Shorter and longer tapers still
  # improve performance but with wider confidence intervals — individual
  # variation in optimal duration is well documented.

  volume_reduction_pct: {min: 41, max: 60}
  # Largest effect (0.72) of any moderator variable in the meta-analysis.
  # Performance responds more to volume reduction than to any other component.

  pattern: progressive
  # Progressive (linear or exponential) outperforms step taper. A fast decay is
  # reported as more beneficial than a slow one.

  maintain_intensity: true
  # Training load must NOT be reduced at the expense of intensity. Intensity
  # maintains the adaptations the taper is meant to express; studies that cut it
  # showed no benefit.

  min_frequency_pct_of_pretaper: 80
  # Reducing session frequency produced no significant improvement. Cut volume
  # through session duration, not by removing sessions.

  reduce_volume_via: session_duration

  # ── Scheduling ────────────────────────────────────────────────
  a_race_taper_days: 14
  a_race_pre_taper_days: 21

  # ── Target TSB at race ────────────────────────────────────────
  # HEURISTIC, not from Bosquet — the meta-analysis does not address TSB.
  # These are the coach's working ranges and may be revised from experience.
  target_tsb_by_event_type:
    time_trial: {min: 8, max: 18}
    road_race: {min: 5, max: 15}
    marathon: {min: 10, max: 20}
    ultra: {min: 10, max: 25}
    criterium: {min: 5, max: 15}
    default: {min: 5, max: 15}
  target_tsb_source: coach_heuristic

# ══════════════════════════════════════════════════════════════════
# METRIC RESOLUTION
# ══════════════════════════════════════════════════════════════════
# Defaults per discipline. An athlete-level override in
# config/athletes/<id>.yaml under metric_overrides always wins.

metric_defaults:
  road: power                  # falls back to lthr when no power meter
  mtb: power
  gravel: power
  trainer: power
  track: pace
  run: pace
  treadmill: pace
  trail: lthr
  # Trail defaults to LTHR, or run power when available. Pace is DISCOURAGED,
  # not prohibited: on variable gradient and surface, pace stops representing
  # effort — the same effort yields paces minutes per km apart.

discouraged_metrics:
  trail:
    metric: pace
    reason: >
      Gradient and surface variability break the relationship between pace and
      effort on trail terrain.
    permitted_when: explicitly_chosen
    requires: >
      Warn the athlete why it is problematic, confirm the choice is deliberate,
      and record it in metric_overrides.trail in the athlete profile so it is not
      re-litigated each block.

no_metric_available:
  fallback: rpe
  note: >
    A trail athlete with neither a power meter nor a heart rate monitor has no
    preferable metric. Prescribe by RPE with descriptive cue text, and tell the
    athlete what a heart rate monitor would add. Never silently default to pace.

# ══════════════════════════════════════════════════════════════════
# STATE FRESHNESS
# ══════════════════════════════════════════════════════════════════

state_block:
  max_age_days: 7
  # Beyond this, the #STATE block is stale: flag it and ask for a rebuild.
  # A stale state presented as current is more damaging than no state at all.
  absent_behavior: stop_and_wait
  rebuild_command: python engine/build_state.py --athlete <id>

# ══════════════════════════════════════════════════════════════════
# LONGITUDINAL ANALYSIS
# ══════════════════════════════════════════════════════════════════
# Governs Stage 6: power/pace curve progression, durability trend, and
# anaerobic repeatability. Curve data is fetched across nested rolling windows
# (42d / 90d / 1y), so progression is read by asking whether recent bests match
# the longer-window bests: when the 42d value equals the 1y value, that peak was
# set recently.

longitudinal:
  # Anchor durations, in seconds, for the cycling power curve.
  # 5s neuromuscular · 1m anaerobic · 5m VO2max · 20m threshold
  # 60m durability · 120m ultra-endurance
  power_anchors_secs: [5, 60, 300, 1200, 3600, 7200]

  # Anchor distances, in metres, for the running pace curve.
  pace_anchors_metres: [400, 1000, 3000, 5000, 10000, 21097]

  # Duration anchors for running, in seconds. The pace curve is indexed by
  # distance, so these are read by inverting it: find the distance whose
  # elapsed time is closest to the anchor. Answers "how far in 60 minutes".
  pace_anchors_secs: [3600, 5400, 7200]

  # Tolerance for matching an anchor to the nearest available curve point.
  anchor_tolerance_pct: 5

  # A recent window value within this fraction of the long-window value means
  # the athlete's best effort at that duration is current, not historical.
  recent_peak_threshold: 0.98

  # Change bands for window-over-window comparison, in percent.
  # Running is stricter than cycling: running power and pace vary less between
  # efforts, so a smaller change is already meaningful.
  delta_bands:
    # Widened after testing against real athletes: between two nested windows
    # (42d inside 90d) a small gap is often just a different ride, not a loss.
    # Only a change beyond the stable floor counts as decline.
    cycling:
      strong_gain: 5.0
      moderate_gain: 2.5
      mild_gain: 1.0
      stable: -2.5
      # below stable → decline
    running:
      strong_gain: 3.0
      moderate_gain: 1.5
      mild_gain: 0.5
      stable: -1.5

  # Composite ratios, computed from anchor values. Each is a ratio of two
  # anchors and describes the shape of the curve rather than its height.
  composites:
    glycolytic_bias:      {numerator: 60,   denominator: 1200}
    aerobic_durability:   {numerator: 3600, denominator: 300}
    durability_gradient:  {numerator: 3600, denominator: 1200}
    anaerobic_reserve:    {numerator: 5,    denominator: 300}

  # Aerobic decoupling trend. A single high-drift session is noise; drift counts
  # when it repeats, or when it is severe on its own.
  durability:
    min_session_seconds: 2700
    moderate_drift_pct: 5.0
    severe_drift_pct: 10.0
    moderate_requires_repeats: 2
    trend_window_sessions: 12
    trend_split: 6


  # ── Testing recommendations ──────────────────────────────────
  # When an anchor sits well below the yearly best, the engine cannot tell
  # whether the athlete lost that capacity or simply has not probed it. Either
  # way the correct action is the same: test it, then re-plan on fresh numbers.
  testing:
    level_trigger_pct: 85
    # An anchor below this percent of the 1y best earns a test recommendation.

    # Prescribe ONLY the test needed to refresh the anchor in question. The
    # five-day cycling week below is a full baseline protocol; a single stale
    # anchor gets its day, not the week.
    #
    # Governing principle, from Palladino's running FTP primer and equally true
    # for cycling: be suspicious of any estimate derived from an effort that was
    # not maximal. Selectively test the durations where the mean-maximal curve is
    # tethered down — which is precisely what level_trigger_pct detects.

    common_frame:
      warmup: Warm up thoroughly before any maximal effort
      after: Easy 45 minutes at low endurance, then cool down
      spacing: >
        Separate maximal tests by at least one day, with an easy recovery day
        before the sprint test. Test efforts need not fall on the same day.

    protocols:
      # ALL protocols are prescribed by DURATION, never by distance. Duration is
      # what the athlete's device steers and what Intervals.icu syntax accepts,
      # and it removes the variability that terrain and course introduce.
      #
      # ── cycling, by anchor duration in seconds ──────────────────
      "5": >
        2 x 10s maximal sprint, flying start, full recovery between.
        Day 5 of the baseline week — always after a recovery day, never on
        accumulated fatigue.
      "60": >
        1-minute maximal test from a rolling start, fully rested.
        Day 3 of the baseline week.
      "300": >
        5-minute maximal test. Day 1 of the baseline week — it opens the week
        because it is the least fatiguing of the long efforts and anchors VO2max.
      "1200": >
        Maximal test of 20-30 minutes, duration set by phenotype: 20 min for a
        time trialist, 25 for an all-rounder or sprinter, 30 for a pursuiter.
        Day 2 of the baseline week, followed by easy 20 minutes at low endurance.
      "3600": >
        60-minute maximal effort, or a ramp test to refresh CP and W'.
        Substantial fatigue cost — schedule it deliberately, not casually.
      "7200": >
        No protocol. Intervals.icu curve data stops at 60 minutes, so this
        anchor cannot be refreshed by testing.

      # ── running, by anchor distance in metres ───────────────────
      # The anchors are distances because that is how the pace curve is indexed,
      # but every PROTOCOL below is prescribed by duration. Palladino's own
      # time-based CP option (3 min + 9 min) is used in place of the track-lap
      # version for exactly this reason.
      #
      # Methods he does not use — Vance 30-min and 3+9 as an FTP formula, Secret
      # of Running 10/20-min, Fitzgerald 20/30-min, and race-time converters —
      # are omitted deliberately. He is explicit that "95% of 20-minute power"
      # is one of the most commonly misapplied assumptions in running FTP.
      "400": >
        1-minute maximal effort from a FLYING start. Running power meters lag on
        a standing start, which corrupts the far left of the curve — Palladino
        recommends flying starts for short-duration testing.
      "1000": >
        3-minute maximal effort, paced as evenly as possible. This is the SHORT
        leg of the CP test — always run before the long leg, never after.
      "3000": >
        12-minute maximal effort, paced as evenly as possible — the LONG leg of
        the CP test. Recover at least 30 minutes between legs when pairing it
        with the 3-minute test in one session.
      "5000": >
        20-minute maximal effort, or a 5k race run to duration rather than to
        distance. Palladino prefers races as CP surrogates because a race is more
        likely to produce a genuinely maximal effort than a solo test.
      "10000": >
        40-45 minute maximal effort, or a 10k race. His preferred single-parameter
        input — the modified Riegel model works best in this duration range.
      "21097": >
        A maximal effort of 80-100 minutes, or a half marathon race.

    # ── Running CP / FTP testing ─────────────────────────────────
    # Steve Palladino, "Protocol for CP Testing" (2020). This supersedes the
    # 3+9 pairing in his earlier primer: the long leg must be at least 10
    # minutes to control overestimation, and 12 is the recommended minimum.
    running_ftp_protocol:
      preferred: two_parameter_critical_power

      components:
        short_minutes: 3
        long_minutes: 12
        long_options_minutes: [12, 15, 20]
        long_minimum_minutes: 10
        recovery_between_minutes: 30
      order: short_before_long
      order_rationale: >
        A long-before-short protocol impairs the short component, and the model
        then OVERESTIMATES CP. A slightly underestimated CP is far preferable to
        an overestimated one, so the short leg always runs first.
      long_leg_note: >
        12 minutes is the recommended minimum. Stronger, more experienced runners
        with good fatigue resistance can use 15 or 20 minutes. A long leg under
        10 minutes raises the risk of overestimation.

      execution:
        - Warm up 15 minutes easy with 4 x ~50m accelerations
        - Stop and let breathing recover fully
        - 3 minutes at maximal effort, paced as evenly as possible
        - Stop and let breathing recover fully
        - Easy running 5-10 minutes
        - Recover fully — at least 30 minutes between the two test segments
        - 12 minutes at maximal effort, paced as evenly as possible
        - Stop and let breathing recover fully
        - Easy cool down for the balance of the planned session
      execution_notes: >
        Turn auto-lap OFF and press the manual lap button at the start and end of
        each test component. Track, path or road are all acceptable as long as the
        effort is uninterrupted. Perfectly even pacing is not essential — a
        maximal effort is.

      pacing_method: >
        Start each component at the modelled power for that duration, or at the
        average power from the previous test. Hold it for the first two thirds to
        three quarters, then ramp to maximum over the final quarter to third.
        Empty the tank by the end of each component.

      venue:
        prefer: loop_or_track
        avoid: >
          Routes where one test meets a headwind and the other a tailwind — the
          air-power mismatch can underestimate RWC and overestimate CP. Avoid
          solving it with 180-degree turns, which lower total air power. A
          sheltered straight-line route run in the same direction for both
          components also works.
        consistency: >
          Use the same protocol, venue, surface, footwear and conditions each
          time. A CP from sea level is not valid at altitude, and one from 18C is
          not valid at 27C, without conversion.

      taper: >
        A CP test needs some taper — not a full one, but it must not be dropped
        into a hard or long training week. Keep the lead-in similar each time.

      validity_weeks: 6
      validity_range_weeks: [4, 8]

      retest_triggers:
        - 10-21 days before an A race, to confirm CP for race power planning
        - Training conditions changed for more than a week or two — heat, humidity, altitude
        - No sufficiently maximal efforts across a range of durations to support a modelled estimate
        - No recent racing to feed or validate the model
        - Training targets routinely feel too easy, or are being exceeded
        - After injury, illness, or a long lay-off
        - After a significant change to the power meter weight setting
        - After changing run power hardware
        - When training both outdoors and on a treadmill
        - When individualising high-intensity interval targets from CP and RWC

      overestimation_causes:
        - Long component shorter than 10 minutes
        - Underperforming the short component relative to the long one
        - Running the long component before the short one

      rwc_sanity_check: >
        Check the RWC (W') estimate alongside CP. A very low RWC suggests CP is
        overestimated; a very high RWC suggests it is underestimated. Treat it as
        a prompt to look closer, not as proof of error.

      weight_change_note: >
        A CP in raw watts is specific to the weight setting on the pod at test
        time. Compare W/kg across test dates, or keep the weight setting fixed.

      race_planning_tte_minutes: 50
      race_planning_note: >
        When applying CP to race target power via the Riegel formula, use 50
        minutes as time to exhaustion at CP. Few non-elite runners hold CP for
        anywhere near 60 minutes.

      # ── Model selection ──────────────────────────────────────
      # The number of data points decides which model is valid.
      model_selection:
        two_points: >
          Linear model — the SuperPower Calculator or the Final Surge CP
          calculator. Correct and sufficient for a 3+12 test.
        more_than_two_points: >
          Do NOT use the two-point linear model. Use a linear 1/time model or a
          multi-parameter power-duration model (WKO, TrainingPeaks, Stryd,
          GoldenCheetah). With more than two points these produce a more valid
          estimate.
        note: >
          The model searches for leverage points in the data. If the inputs are
          not maximal efforts, the CP and RWC estimates are wrong — no model
          repairs a submaximal input.

      # ── Same-day testing ─────────────────────────────────────
      same_day_preferred: true
      same_day_rationale: >
        Running both components on the same day — or within a couple of days —
        fixes the environmental conditions for the estimate. A multi-parameter
        model draws on any effort from the last 90 days, so its inputs carry
        unknown and mixed temperature and humidity. A same-day 3+12 gives CP,
        RWC and a known baseline condition together.

      # ── What the test yields beyond CP ───────────────────────
      derived_outputs:
        - name: Reserve Work Capacity (RWC / W')
          use: >
            Comes out of the same model as CP. Feed CP and RWC together into an
            individualised interval power target calculator to get power ranges
            per interval type, rather than generic percentages.
        - name: Power at VO2max
          use: >
            The 5-minute power estimated from CP and RWC is a surrogate for power
            at VO2max, typically within 2% of a graded exercise test. It sets the
            ceiling of the maximal aerobic power zone.
          caveat: >
            A lab graded test on a treadmill carries no air-power component, so
            its value is not directly comparable to outdoor power without
            conversion.
        - name: VO2max estimate
          use: >
            Enter the distance covered in the 12-minute component into a Cooper
            test calculator for an approximate VO2max.
        - name: Running Effectiveness sample
          use: >
            When the 12-minute component is run on a track or flat surface, it
            provides a useful RE sample for that intensity — applicable to 5k
            pacing, where RE will be close to the same value.

      # ── Quality control on the estimate ──────────────────────
      quality_control:
        cross_check: >
          Run the 12-minute component alone through a single-effort calculator
          for efforts under 50 minutes. It returns a CP range. If the 3+12
          estimate falls dramatically outside that range, treat the test as
          suspect. Athletes with high RWC tend toward the upper end of the range,
          low RWC toward the lower end.
        air_power_check: >
          Compare air power between components. The 3-minute test runs faster, so
          its air power should be equal to or about 1% HIGHER than the 12-minute
          test. It should NEVER be lower. Lower air power on the short component
          means a wind or direction problem, and it can underestimate RWC while
          overestimating CP.
        environmental_baseline: >
          Record temperature and humidity for both components. Heat and humidity
          affect longer durations far more than short ones — an 80F 400m is
          barely touched while an 80F 10k is heavily affected. When the two
          components differ, use the 12-minute component's conditions as the
          baseline for the estimate.

      record_each_test:
        - Date, location and route
        - Average power and duration for each component
        - CP and RWC estimates
        - Power meter weight setting and pod type
        - Temperature, humidity, altitude
        - TSB or RSB at the time of the test
        - Shoes used and pod placement

      single_parameter_fallback:
        model: modified_riegel
        formula: estimated_FTP = known_power * (predicted_duration / known_duration) ^ exponent
        predicted_duration_minutes: 50
        bracket_with_minutes: 45
        exponent_default: -0.06
        exponent_range: [-0.08, -0.05]
        exponent_note: >
          -0.07 for most runners, -0.06 for those with very good fatigue
          resistance, -0.05 for higher-calibre runners, up to -0.08 for lower
          aerobic fitness with high anaerobic capacity. The correct exponent is
          individual and shifts across a training cycle.
        requires: A maximal effort, ideally a race between 5k and half marathon.

  # W' balance depletion above 100% is not physically possible. When it appears,
  # the athlete's configured W' is too low and every anaerobic reading derived
  # from it is compressed.
  w_prime_review_trigger_sessions: 1

  # Activity types that carry no endurance training load. Counted and reported
  # so the coach knows what share of the log is not part of the analysis.
  non_endurance_types: [Yoga, WeightTraining, Workout, Walk, Hike, Rowing, Swim]

  # Anaerobic repeatability, from W' balance depletion across sessions.
  repeatability:
    min_sessions: 3
    high_depletion_pct: 80
    # Fraction of W' consumed that marks a genuinely anaerobic session.
    declining_threshold_pct: 15
    # Drop in peak depletion between window halves that indicates the athlete
    # is no longer able to reach the same anaerobic depth.

# Decision Thresholds — Infame Elite Endurance Coach v7
#
# Cross-cutting rules that are NOT properties of any single author.
# Every key here is read by code: change it here and the engine, the validator
# and the server follow. Rules that need judgement live in the prompt, not here
# (v7.48: keys no code read were removed or turned into comments).
#
# SECTION INDEX (v7.33) — search for the name followed by a colon.
#   Writing a workout
#     output_formats         how each metric is written ......... validator, zone tables
#     prescription_floors    minimum targets per class ........... validator, zone tables
#     disciplines            canonical names and aliases ......... profile, validator, core sessions, restrictions
#     ramps                  where a ramp target is allowed ...... validator
#     metric_equipment       metric needs which device ........... validator
#     tss_rules              TSS per session and per class ....... validator
#   Athlete state (#STATE)
#     state_resolution       TSB bands, HRV, ACWR ................ build_state
#     longitudinal           curves, durability, repeatability ... build_state, longitudinal
#     heads_up               alerts and adherence ................ build_state, execution, roster
#     load_monotony          Foster monotony and strain .......... load_metrics, validator
#     neuromuscular_density  days with work above FTP ............ build_state, load_metrics
#   Races and the week as a whole
#     race_priorities        A+ … D and their Intervals.icu map .. profile, state, core sessions, race demand
#     taper                  taper length and target TSB ......... build_state, plan checks, roster, validator
#     plan_checks            spacing, ramp, recovery, easy share . plan checks, validator
#   Server
#     mcp                    #STATE cache minutes ................ mcp_server

# ══════════════════════════════════════════════════════════════════
# OUTPUT FORMATS — how each metric is written in Intervals.icu syntax
# ══════════════════════════════════════════════════════════════════
# The zone tables document ranges as "% FTP" for readability. That label is
# documentation, not syntax. What gets emitted in a workout block is defined here.
# The validator rejects any target that does not match its metric's `syntax` form.

output_formats:
  power:
    syntax: "%"                    # e.g. "85-95%" — bare percentage, no suffix
    table_label: "% FTP"
    forbidden_suffixes: ["FTP", "CP", "W", "watts"]
    note: Power is emitted as a standalone percentage. Never append FTP or CP.

  lthr:
    syntax: "% LTHR"               # e.g. "85-90% LTHR"
    table_label: "% LTHR"
    forbidden_suffixes: ["HR", "HRmax", "bpm"]
    note: Heart rate is always expressed as % LTHR, never % HR or % HRmax.

  pace:
    syntax: "% Pace"               # e.g. "80-85% Pace"
    table_label: "% Threshold Pace"
    forbidden_suffixes: ["min/km", "min/mi", "/km", "/mile"]
    note: Pace is always relative to threshold pace. Never emit absolute pace.

  hrmax:
    syntax: null                   # never emitted — see special_output_rule per author
    table_label: "% HRmax"
    note: >
      % HRmax is a documentation-only metric. Any author whose native metric is
      % HRmax must declare a special_output_rule substituting an emittable metric.

# ══════════════════════════════════════════════════════════════════
# PRESCRIPTION FLOORS — minimum intensity that may be prescribed
# ══════════════════════════════════════════════════════════════════
# Author zone tables preserve the source faithfully, including open lower bounds
# ("< 55%"). Those bounds describe where the zone *begins*, not what may be
# *prescribed*. A target at or near zero causes execution problems — an ERG
# trainer drops to no resistance, and a device cannot steer a near-zero target.
#
# The generator renders open lower bounds using these floors, so the tables the
# coach and the model read already show the usable range. The validator rejects
# any emitted target below the floor for its metric.

prescription_floors:
  power: 25       # % FTP — avoids zero-resistance ERG behavior
  lthr: 50        # % LTHR — below this is below resting heart rate territory
  pace: 40        # % threshold pace
  hrmax: 40       # % HRmax — near resting heart rate

# ══════════════════════════════════════════════════════════════════
# DISCIPLINES — the one vocabulary used everywhere
# ══════════════════════════════════════════════════════════════════
# Every discipline name in the system — session headers, athlete profiles,
# ramp rules, metric defaults — must be one of these canonical names. Each name
# means exactly one thing: "road" used to mean road cycling in one place and
# road running in another, and "track" could be a velodrome or a running track.
#
# `sport` must match the sport of the session's methodology (config/authors):
# a running methodology on a cycling discipline is a hard error.

# `indoor: true` marks a discipline ridden or run indoors. Whatever the
# discipline, an indoor session is uploaded to Intervals.icu as plain
# Ride / Run with the indoor box checked, NEVER as VirtualRide / VirtualRun:
# only that way does Intervals.icu apply the athlete's Indoor FTP (and the
# indoor zones) instead of the outdoor FTP. Any new indoor discipline must
# carry `indoor: true` here.
disciplines:
  canonical:
    road_bike: {sport: cycling}
    mtb:       {sport: cycling}
    gravel:    {sport: cycling}
    trainer:   {sport: cycling, indoor: true}    # indoor, smart trainer
    road_run:  {sport: running}
    trail_run: {sport: running}
    treadmill: {sport: running, indoor: true}    # indoor
    track_run: {sport: running}

  # Older or informal names still accepted in session headers, so blocks written
  # before this vocabulary keep validating. A name that maps to one discipline
  # per sport is resolved with the sport of the session's methodology.
  aliases:
    road:       {cycling: road_bike, running: road_run}
    run:        road_run
    trail:      trail_run
    track:      track_run
    indoor:     trainer
    rodillo:    trainer
    caminadora: treadmill

# ══════════════════════════════════════════════════════════════════
# RACE PRIORITIES
# ══════════════════════════════════════════════════════════════════
# The coach works with six levels; Intervals.icu stores only A, B and C. The
# athlete profile (goals[].priority) carries the full level for the coach's
# reasoning; the race is entered in Intervals.icu with the mapped letter, which
# is what the state engine reads.

race_priorities:
  levels: [A+, A, A-, B, C, D]      # highest to lowest
  intervals_icu: {A+: A, A: A, A-: A, B: B, C: C, D: C}

# ══════════════════════════════════════════════════════════════════
# RAMP ELIGIBILITY
# ══════════════════════════════════════════════════════════════════
# A ramp (`ramp` in the syntax) is a CONTINUOUSLY changing target. Only a smart
# trainer under power (ERG) control can follow one. Every other discipline
# steers its target by hand — the athlete adjusts speed or effort — so a
# progression there is written as discrete steps, which are ordinary steps and
# always valid. On a treadmill, a progressive protocol is a staircase of steps,
# never a `ramp`.
# An athlete can also switch ramps off for an eligible discipline with
# ramp_overrides.disable_ramps in config/athletes/<id>.yaml.

ramps:
  allowed_disciplines: [trainer]
  required_metrics: [power]
  # Every other discipline is forbidden. No cap is placed on ramp duration or
  # delta: a progressive ramp test is a legitimate protocol, and any numeric
  # ceiling would prohibit it. Magnitude is the coach's judgement.

# ══════════════════════════════════════════════════════════════════
# METRIC EQUIPMENT — which device a metric depends on
# ══════════════════════════════════════════════════════════════════
# Any methodology may be prescribed in any metric of its sport; the metric is
# the athlete's choice, limited only by the equipment they have. A metric is
# blocked only when EVERY device listed for it is declared false in the athlete
# profile (equipment.*). null means "not asked yet" and never blocks.
#
# Lookup order for a metric: the discipline's own entry, then the sport's, then
# `any`. An empty list means the metric needs no extra device.
#   - Pace on runs needs nothing extra: a GPS watch or phone outdoors, the
#     treadmill's own display indoors.
#   - Power on a trainer is available from a smart trainer or a power meter.

metric_equipment:
  power:
    trainer: [bike_power_meter, smart_trainer]
    cycling: [bike_power_meter]
    running: [run_power_meter]
  lthr:
    any: [hr_monitor]
  pace:
    running: []

# ══════════════════════════════════════════════════════════════════
# TSS COMPUTATION RULES
# ══════════════════════════════════════════════════════════════════
# Resolves the ambiguities that made v5.1 TSS estimates vary between runs.
# Multipliers live in config/tss_classes.yaml; these are the procedural rules.

tss_rules:
  method: if_squared                # if_squared | class_multiplier — legacy / fallback
  # if_squared: each step costs hours x IF^2 x 100, IF = target / threshold.
  # class_multiplier (flat tss_per_min per class) is kept only as legacy: it
  # charged 56% and 74% FTP the same 60 TSS/h, overestimating easy rides by
  # up to ~65% (Oct 2026: a 3h45 MTB ride at 55-64% read 215 here vs 128 in
  # Intervals.icu).
  method_by_target:                 # v7.38 — how Intervals.icu costs each target
    cycling_power: np_30s           # Normalized Power, 30 s rolling average
    running_power: if_squared
    pace: if_squared
    heart_rate: hrss                # normalised TRIMP (LTHR, max HR, resting HR)
  # Measured 2026-10-08 against the loads Intervals.icu stored for the head
  # coach's real planned workouts (largest gap): cycling power 74 sessions,
  # np_30s 1.4 TSS (if_squared was 11, always low on intervals); running
  # pace 44 sessions, if_squared 1.0; running power 11 sessions, if_squared
  # 0.6; heart rate 6 sessions, if_squared up to 2x the stored load, hrss far
  # closer but not exact (Intervals.icu keeps the thresholds of the day).
  # A session mixing target families (power + LTHR) uses `method`.
  # Details and formulas: engine/planned_load.py.
  np_window_seconds: 30
  upload_check_tolerance_tss: 2     # push_block: report a session whose load
                                    # Intervals.icu computed differs by more
  range_cost_point: midpoint        # midpoint | low | high — how a target range is costed
  repeats_multiply: true            # a repeat block multiplies its steps by the count
  rounding: nearest_integer
  # Fixed in code, not settings: a ramp is costed at its midpoint under
  # if_squared (np_30s and hrss follow it second by second); recovery steps
  # inside repeats are costed; a range spanning two classes takes the class of
  # its midpoint; distance steps (2km, 500mtr) have no duration until the pace
  # is known, so they are left out of the total and reported (CHK-TSS-PARTIAL).
  divergence_tolerance_pct: 10
  # Maximum permitted gap between a declared and a recomputed session TSS.
  duration_divergence_tolerance_minutes: 2
  # Maximum permitted gap between a declared [Duration] and the sum of
  # every step's own duration (including repeats). Unlike TSS this is pure
  # arithmetic with no classification judgment involved, so the tolerance
  # only needs to absorb header rounding — not a margin for disagreement.

# ══════════════════════════════════════════════════════════════════
# CLASSIFICATION CUTPOINTS — derived, no longer stored here (v7.2)
# ══════════════════════════════════════════════════════════════════
# The class bands live in ONE place: config/tss_classes.yaml → bands, on the
# canonical axis (% of threshold) per sport. The per-metric cutpoints the
# validator and the state engine use for loose targets are computed from those
# bands through config/crosswalk.yaml by zone_model.derived_cutpoints() and
# injected at load time as `classification_cutpoints`. Keeping a second copy
# here is what let the two drift apart before v7.2.
#
# PRECEDENCE — unchanged:
#   1. A target that falls inside a zone of the active methodology takes that
#      zone's class (now computed by zone_model.py, including the author's
#      crosswalk-estimated columns).
#   2. The derived cutpoints apply only when no zone contains the target.

# ══════════════════════════════════════════════════════════════════
# ATHLETE STATE RESOLUTION
# ══════════════════════════════════════════════════════════════════
# TSB is the primary governor. HRV is secondary and applies only where TSB is
# absent. ACWR acts as a validation gate that can downgrade a severe reading.

state_resolution:
  tsb_bands:
    maladaptation_risk: {max: -30}
    functional_overreach: {min: -30, max: -20}
    load_pressure: {min: -20, max: -10}
    neutral: {min: -10, max: 10}
    fresh: {min: 10}

  acwr_safe_range: {min: 0.8, max: 1.3}
  # Within this range, a maladaptation_risk reading accompanied by stable
  # durability is downgraded to functional_overreach.

  hrv_bands:
    suppressed: {max: 0.90}         # ratio to baseline
    normal: {min: 0.90, max: 1.10}
    elevated: {min: 1.10}

  # The two operational states build_state resolves from these bands:
  # recovery_priority and load_accepting.

# ══════════════════════════════════════════════════════════════════
# TAPER GOVERNANCE
# ══════════════════════════════════════════════════════════════════

taper:
  # Volume, duration, intensity and frequency parameters come from:
  #   Bosquet L, Montpetit J, Arvisais D, Mujika I. Effects of Tapering on
  #   Performance: A Meta-Analysis. Med Sci Sports Exerc. 2007;39(8):1358-1365.
  #   27 studies of competitive athletes.

  # Duration: 8-14 d carries the largest effect (0.59). Shorter and longer tapers still
  # improve performance but with wider confidence intervals — individual
  # variation in optimal duration is well documented.

  volume_reduction_pct: {min: 21, max: 60}
  # Band for cycling and running, the only sports this system coaches.
  # Bosquet's pooled optimum is 41-60% (effect 0.72, the largest moderator in
  # the meta-analysis), but that result is driven by swimming (0.81, P <= 0.01).
  # In the per-sport data (Table 2) 41-60% is NOT significant in running (0.23,
  # N = 14) or cycling (2.14, N = 15), while 21-40% trends positive in both
  # (0.47 and 0.84, P <= 0.10). The authors conclude (p. 1362): "we were not
  # able to find a similar cutoff value in cycling and running, the optimal
  # decrease being somewhere between 21 and 60%." Below 21% no benefit in any
  # sport. KB: TPOP-C09-022. Where to sit inside the band is coach judgement,
  # e.g. by how much fatigue the athlete carries into the taper.

  pattern: progressive
  # Default, not a proven winner. Progressive (linear or exponential) is
  # significant overall (0.30, N = 380) and in running (0.46 vs -0.09 for step).
  # Overall, step taper's point estimate is higher (0.42) but not significant
  # (N = 98); in cycling the authors call step vs progressive unresolved.

  # Intensity is maintained: training load must NOT be reduced at the expense of intensity. Intensity
  # maintains the adaptations the taper is meant to express; studies that cut it
  # showed no benefit.

  min_frequency_pct_of_pretaper: 80
  # Reducing session frequency produced no significant improvement. Cut volume
  # through session duration, not by removing sessions.

  # ── Scheduling ────────────────────────────────────────────────
  a_race_taper_days: 14
  a_race_pre_taper_days: 21

  # ── Target TSB at race ────────────────────────────────────────
  # HEURISTIC, not from Bosquet — the meta-analysis does not address TSB.
  # These are the coach's working ranges and may be revised from experience.
  target_tsb_by_event_type:
    time_trial: {min: 8, max: 18}
    road_race: {min: 5, max: 15}
    marathon: {min: 10, max: 20}
    ultra: {min: 10, max: 25}
    criterium: {min: 5, max: 15}
    stage_race: {min: 5, max: 15}   # taper targets stage 1 only; later stages are
                                    # about durability and glycogen management
    default: {min: 5, max: 15}

# ══════════════════════════════════════════════════════════════════
# LONGITUDINAL ANALYSIS
# ══════════════════════════════════════════════════════════════════
# Governs Stage 6: power/pace curve progression, durability trend, and
# anaerobic repeatability. Curve data is fetched across nested rolling windows
# (42d / 90d / 1y), so progression is read by asking whether recent bests match
# the longer-window bests: when the 42d value equals the 1y value, that peak was
# set recently.

longitudinal:
  # Anchor durations, in seconds, for the cycling power curve.
  # 5s neuromuscular · 1m anaerobic · 5m VO2max · 20m threshold
  # 60m durability · 120m ultra-endurance
  power_anchors_secs: [5, 60, 300, 1200, 3600, 7200]

  # Anchor distances, in metres, for the running pace curve.
  pace_anchors_metres: [400, 1000, 3000, 5000, 10000, 21097]

  # Change bands for window-over-window comparison, in percent.
  # Running is stricter than cycling: running power and pace vary less between
  # efforts, so a smaller change is already meaningful.
  delta_bands:
    # Widened after testing against real athletes: between two nested windows
    # (42d inside 90d) a small gap is often just a different ride, not a loss.
    # Only a change beyond the stable floor counts as decline.
    cycling:
      strong_gain: 5.0
      moderate_gain: 2.5
      mild_gain: 1.0
      stable: -2.5
      # below stable → decline
    running:
      strong_gain: 3.0
      moderate_gain: 1.5
      mild_gain: 0.5
      stable: -1.5

  # Composite ratios, computed from anchor values. Each is a ratio of two
  # anchors and describes the shape of the curve rather than its height.
  composites:
    glycolytic_bias:      {numerator: 60,   denominator: 1200}
    aerobic_durability:   {numerator: 3600, denominator: 300}
    durability_gradient:  {numerator: 3600, denominator: 1200}
    anaerobic_reserve:    {numerator: 5,    denominator: 300}

  # Aerobic decoupling trend. A single high-drift session is noise; drift counts
  # when it repeats, or when it is severe on its own.
  durability:
    min_session_seconds: 2700
    moderate_drift_pct: 5.0
    severe_drift_pct: 10.0
    moderate_requires_repeats: 2
    trend_window_sessions: 12
    trend_split: 6


  # ── Testing recommendations ──────────────────────────────────
  # When an anchor sits well below the yearly best, the engine cannot tell
  # whether the athlete lost that capacity or simply has not probed it. Either
  # way the correct action is the same: test it, then re-plan on fresh numbers.
  testing:
    level_trigger_pct: 85
    # An anchor below this percent of the 1y best earns a test recommendation.

    # Prescribe ONLY the test needed to refresh the anchor in question. The
    # five-day cycling week below is a full baseline protocol; a single stale
    # anchor gets its day, not the week.
    #
    # Governing principle, from Palladino's running FTP primer and equally true
    # for cycling: be suspicious of any estimate derived from an effort that was
    # not maximal. Selectively test the durations where the mean-maximal curve is
    # tethered down — which is precisely what level_trigger_pct detects.

    common_frame:
      warmup: Warm up thoroughly before any maximal effort
      after: Easy 45 minutes at low endurance, then cool down
      spacing: >
        Separate maximal tests by at least one day, with an easy recovery day
        before the sprint test. Test efforts need not fall on the same day.

    protocols:
      # ALL protocols are prescribed by DURATION, never by distance. Duration is
      # what the athlete's device steers and what Intervals.icu syntax accepts,
      # and it removes the variability that terrain and course introduce.
      #
      # ── cycling, by anchor duration in seconds ──────────────────
      "5": >
        2 x 10s maximal sprint, flying start, full recovery between.
        Day 5 of the baseline week — always after a recovery day, never on
        accumulated fatigue.
      "60": >
        1-minute maximal test from a rolling start, fully rested.
        Day 3 of the baseline week.
      "300": >
        5-minute maximal test. Day 1 of the baseline week — it opens the week
        because it is the least fatiguing of the long efforts and anchors VO2max.
      "1200": >
        Maximal test of 20-30 minutes, duration set by phenotype: 20 min for a
        time trialist, 25 for an all-rounder or sprinter, 30 for a pursuiter.
        Day 2 of the baseline week, followed by easy 20 minutes at low endurance.
      "3600": >
        60-minute maximal effort, or a ramp test to refresh CP and W'.
        Substantial fatigue cost — schedule it deliberately, not casually.
      "7200": >
        No protocol. Intervals.icu curve data stops at 60 minutes, so this
        anchor cannot be refreshed by testing.

      # ── running, by anchor distance in metres ───────────────────
      # The anchors are distances because that is how the pace curve is indexed,
      # but every PROTOCOL below is prescribed by duration. Palladino's own
      # time-based CP option (3 min + 9 min) is used in place of the track-lap
      # version for exactly this reason.
      #
      # Methods he does not use — Vance 30-min and 3+9 as an FTP formula, Secret
      # of Running 10/20-min, Fitzgerald 20/30-min, and race-time converters —
      # are omitted deliberately. He is explicit that "95% of 20-minute power"
      # is one of the most commonly misapplied assumptions in running FTP.
      "400": >
        1-minute maximal effort from a FLYING start. Running power meters lag on
        a standing start, which corrupts the far left of the curve — Palladino
        recommends flying starts for short-duration testing.
      "1000": >
        3-minute maximal effort, paced as evenly as possible. This is the SHORT
        leg of the CP test — always run before the long leg, never after.
      "3000": >
        12-minute maximal effort, paced as evenly as possible — the LONG leg of
        the CP test. Recover at least 30 minutes between legs when pairing it
        with the 3-minute test in one session.
      "5000": >
        20-minute maximal effort, or a 5k race run to duration rather than to
        distance. Palladino prefers races as CP surrogates because a race is more
        likely to produce a genuinely maximal effort than a solo test.
      "10000": >
        40-45 minute maximal effort, or a 10k race. His preferred single-parameter
        input — the modified Riegel model works best in this duration range.
      "21097": >
        A maximal effort of 80-100 minutes, or a half marathon race.

  # W' balance depletion above 100% is not physically possible. When it appears,
  # the athlete's configured W' is too low and every anaerobic reading derived
  # from it is compressed.
  w_prime_review_trigger_sessions: 1

  # Activity types that carry no endurance training load. Counted and reported
  # so the coach knows what share of the log is not part of the analysis.
  non_endurance_types: [Yoga, WeightTraining, Workout, Walk, Hike, Rowing, Swim]

  # Anaerobic repeatability, from W' balance depletion across sessions.
  repeatability:
    min_sessions: 3
    high_depletion_pct: 80
    # Fraction of W' consumed that marks a genuinely anaerobic session.
    declining_threshold_pct: 15
    # Drop in peak depletion between window halves that indicates the athlete
    # is no longer able to reach the same anaerobic depth.

# ══════════════════════════════════════════════════════════════════
# HEADS-UP (engine/heads_up.py)
# ══════════════════════════════════════════════════════════════════
# The short list at the top of #STATE that the coach reads out when work on
# an athlete starts. Two kinds of line, never mixed:
#   - "Check" items: something the head coach may want to fix in
#     Intervals.icu or the declared profile before planning. Reported,
#     never blocking.
#   - "Optional data": wellness coverage and W'. Information only. Few
#     athletes keep HRV, sleep or W' accurate, so none of it is ever a fault
#     or a requirement.
heads_up:
  lookback_days: 28
  # Window for "which sports does this athlete train" and for wellness
  # coverage.
  inactivity_days: 7
  # No activity for this many days or more becomes a Check item (injury,
  # illness, a device that stopped syncing).
  unpaired_lookback_days: 7
  # A planned session in this many recent days with no activity paired to it
  # in Intervals.icu becomes a Check item. Wording is "unpaired", never
  # "missed": skipped and done-but-not-paired look the same from here.
  adherence: {min_pct: 80, max_pct: 120, min_compliance: 70}
  # A paired session is "done differently" when its time or load falls
  # outside min_pct-max_pct of the plan, Intervals.icu compliance is below
  # min_compliance, or it was another sport (engine/execution.py, v7.27).
  # Those sessions become a Check item: the next week is designed from what
  # was done. Coach judgement, not a sourced rule.
  eftp_divergence_pct: 5
  # |eFTP - FTP| / FTP above this becomes a Check item: the FTP set in
  # Intervals.icu may be out of date. Same signal the prompt's "threshold
  # #STATE contradicts is provisional" rule reasons from.
  sport_types:
    # Intervals.icu activity types whose thresholds this system prescribes
    # from. Other types (swim, strength, walk) are never checked.
    cycling: [Ride, VirtualRide, MountainBikeRide, GravelRide, TrackRide]
    running: [Run, TrailRun, VirtualRun]

# ══════════════════════════════════════════════════════════════════
# LOAD MONOTONY & STRAIN (engine/load_metrics.py) — Foster 2001, M2
# ══════════════════════════════════════════════════════════════════
# monotony = mean(daily load) / stdev(daily load) over 7 days; strain =
# weekly load total * monotony. Informational only, never a requirement:
# reported wherever it can be computed, never blocking anything.
#   - Past days: build_state.py's own #STATE signal, over the trailing
#     real 7 days (a day with nothing logged counts as a real zero).
#   - Planned week: verify/validate_block.py warns (never blocks) before
#     upload, using the block's own estimated TSS for the days it covers
#     and the athlete's real recent days for the rest of that same week.
load_monotony:
  risk_threshold: 2.0
  # Foster's commonly cited risk line. Above this, warn -- never block.

# ══════════════════════════════════════════════════════════════════
# NEUROMUSCULAR / HIGH-INTENSITY DENSITY (engine/load_metrics.py) — M3
# ══════════════════════════════════════════════════════════════════
# TSS is built from an averaged intensity factor and undercounts short
# supra-threshold efforts (sprints, attacks) -- this reads Intervals.icu's
# own neuromuscular field instead of inferring it from TSS. Reported over
# the trailing 7 days wherever the field is populated; not available for a
# workout prescribed by %FTP rather than absolute watts, or a non-power
# sport. Purely informational.
neuromuscular_density:
  day_kj_threshold: 20
  # A day's kJ above FTP past this line counts toward "days over threshold".

# ══════════════════════════════════════════════════════════════════
# MCP SERVER
# ══════════════════════════════════════════════════════════════════
# The MCP server's tools call the same engine functions coach.py does.
# This threshold prevents a tool asked about the same athlete repeatedly in
# one conversation from hitting the Intervals.icu API every time — athletes
# sync roughly once a day, so a fresh fetch has a real shelf life.
mcp:
  # Minutes before get_athlete_state()/get_athlete_profile() re-fetch instead
  # of reusing the existing data/<id>/athlete_data.json. state.md/profile.md
  # are still re-rendered from that data on every call regardless of this
  # value, so a config or threshold edit is never served stale — only the
  # network fetch itself is skipped. force_refresh=true on either tool
  # bypasses this unconditionally.
  state_cache_minutes: 60

# ══════════════════════════════════════════════════════════════════
# PLAN CHECKS — the week as a whole (v7.25)
# ══════════════════════════════════════════════════════════════════
# verify/validate_block.py + engine/plan_checks.py. Every check WARNS, never
# blocks: each is a prompt for the head coach's judgement, and a deliberate
# choice (back-to-back days before a stage race, a big first week after a
# break) is a valid answer. An athlete can override any value, or switch a
# check off, with `plan_checks` in config/athletes/<id>.yaml plus a `reason`
# (shown with every line that uses it).
plan_checks:
  # A hard day: at least this many minutes in steps at or above this class
  # (each step's class from the author's table, at its midpoint).
  hard_session: {at_or_above: threshold, min_minutes: 8}

  # CHK-SPACING — two hard days in a row. Friel: density is how closely the
  # high-dose workouts are spaced; too dense is the second most common cause
  # of stalled fitness (CTB-C05-035, CTB-C09-032).
  spacing: {min_easy_days_between_hard: 1}

  # CHK-RAMP — one sport's planned weekly load against the mean of its last 4
  # complete weeks of real load. 1.3 is the top of acwr_safe_range above.
  ramp: {max_ratio: 1.3, baseline_weeks: 4, min_baseline_load: 50}

  # CHK-RECOVERY — weeks of load in a row with no lighter week. Friel puts
  # the rest-and-recovery week every third or fourth week (CTB-C08-026). A
  # week counts as lighter when its load is at least `drop_pct` below the
  # mean of the 3 weeks before it.
  recovery: {max_loading_weeks: 3, drop_pct: 20}

  # CHK-EASY — share of written time (all sports) in recovery and endurance,
  # per week with at least `min_sessions` sessions in the file. "Far more
  # easy rides than hard ones" (HPC-C02-010, HPC-C08-004); the 70% line is
  # coach judgement.
  easy_share: {min_pct: 70, min_sessions: 3}

  # CHK-TAPER — inside `taper.a_race_taper_days` before the next A goal:
  # volume cut against the `taper.a_race_pre_taper_days` before it must sit in
  # taper.volume_reduction_pct, frequency stay at or above
  # taper.min_frequency_pct_of_pretaper, and intensity stay (at least one
  # hard day). Uses the taper section above (Bosquet 2007, TPOP-C09-022).
  taper: {min_history_days: 14}

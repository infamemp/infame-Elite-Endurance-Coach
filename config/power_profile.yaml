# Power Profile — Infame Elite Endurance Coach v6
#
# Andrew Coggan's power profile table. Maximal power output in W/kg at four
# anchor durations, from world-record holder down to untrained.
# Source: TrainingPeaks / Allen & Coggan, "Training and Racing with a Power Meter".
#
# Used for two things:
#   1. Where an athlete's power at each duration ranks against a population
#   2. Phenotype — read from the SHAPE of that ranking across durations, not
#      from any single value. A sprinter ranks high at 5s and low at threshold;
#      a time trialist is the reverse. This is Coggan's own method.
#
# Rows are ordered from highest to lowest and interpolated linearly to produce a
# 0-100 score per duration. The scale is ordinal, not a true percentile: it says
# where the athlete sits between the table's anchor rows.

anchors:
  # Column order: 5s, 1min, 5min, FT (functional threshold)
  men:
    - {label: world_record,        values: [25.18, 11.50, 7.60, 6.60]}
    - {label: world_class,         values: [23.97, 11.03, 7.18, 6.22]}
    - {label: exceptional,         values: [23.06, 10.68, 6.86, 5.93]}
    - {label: exceptional_low,     values: [21.25,  9.97, 6.23, 5.36]}
    - {label: excellent,           values: [20.34,  9.62, 5.91, 5.08]}
    - {label: very_good,           values: [19.43,  9.27, 5.59, 4.79]}
    - {label: very_good_low,       values: [17.61,  8.57, 4.96, 4.22]}
    - {label: good,                values: [16.71,  8.21, 4.64, 3.93]}
    - {label: moderate,            values: [15.80,  7.86, 4.32, 3.65]}
    - {label: moderate_low,        values: [13.98,  7.16, 3.69, 3.08]}
    - {label: fair,                values: [13.08,  6.80, 3.37, 2.79]}
    - {label: novice_2,            values: [12.17,  6.45, 3.06, 2.51]}
    - {label: average_untrained,   values: [11.26,  6.10, 2.74, 2.22]}
    - {label: novice_1,            values: [10.35,  5.75, 2.42, 1.93]}
    - {label: lowest,              values: [ 8.23,  4.93, 1.68, 1.27]}
  women:
    - {label: world_record,        values: [19.42, 9.29, 6.74, 5.69]}
    - {label: world_class,         values: [18.54, 8.92, 6.35, 5.35]}
    - {label: exceptional,         values: [17.88, 8.64, 6.06, 5.10]}
    - {label: exceptional_low,     values: [16.56, 8.09, 5.47, 4.60]}
    - {label: excellent,           values: [15.90, 7.81, 5.18, 4.35]}
    - {label: very_good,           values: [15.24, 7.53, 4.89, 4.10]}
    - {label: very_good_low,       values: [13.91, 6.97, 4.31, 3.59]}
    - {label: good,                values: [13.25, 6.70, 4.01, 3.34]}
    - {label: moderate,            values: [12.59, 6.42, 3.72, 3.09]}
    - {label: moderate_low,        values: [11.27, 5.86, 3.14, 2.59]}
    - {label: fair,                values: [10.61, 5.59, 2.84, 2.33]}
    - {label: novice_2,            values: [ 9.95, 5.31, 2.55, 2.08]}
    - {label: average_untrained,   values: [ 9.29, 5.03, 2.26, 1.83]}
    - {label: novice_1,            values: [ 8.63, 4.75, 1.97, 1.58]}
    - {label: lowest,              values: [ 7.09, 4.10, 1.29, 0.99]}

# Which curve anchor feeds each column. FT has no direct curve anchor: the
# athlete's configured FTP is used when available, otherwise the 60-minute
# value, otherwise 95% of the 20-minute value.
column_anchors: [5, 60, 300, ft]
ft_fallback:
  prefer: configured_ftp
  then_seconds: 3600
  then_from_1200_factor: 0.95

# ── Phenotype ─────────────────────────────────────────────────────
# Read from the SHAPE of the ranking across durations. The gap between the
# sprint score and the threshold score is the primary signal; the middle
# durations separate a pursuiter from an all-rounder.
phenotype:
  sprint_vs_threshold_gap: 15
  # score(5s) minus score(FT). Above → sprinter. Below the negative → time trialist.
  middle_elevation: 8
  # How far the 1min/5min mean must sit above the mean of the two ends to call
  # a pursuiter rather than an all-rounder.

  # Day-2 maximal test duration for the structured testing week, per phenotype.
  test_duration_minutes:
    time_trialist: 20
    all_rounder: 25
    sprinter: 25
    pursuiter: 30

# Palladino Running Power/Pace Zones
# Conforms to config/schema/author.schema.json
# Migrated from Training_Zones/Simple_Table_Running_Training_Zones.md (v5.1)

id: palladino
name: Palladino Running Power/Pace Zones

# Knowledge base the coach reads for this methodology (path relative to Knowledge/).
knowledge_file: Steve_Palladino_Running_with_Power.md
sport: running

zone_identifier_style: Number with letter sub-zone (e.g. "1A", "3B")

default_metric: power
available_metrics: [power]
primary_metrics:
  - Functional Threshold Power (FTP) / Critical Power (CP)
intensity_anchors: ["% FTP/CP"]

metric_labels:
  power: "% FTP/CP"

metric_status:
  power: native

# v7.2: only the author's own numbers live here. % threshold pace and % LTHR are
# estimated by zone_model.py through config/crosswalk.yaml.

notes:
  - >-
    Palladino states the intensity domain of his own zones: heavy >80% to ~100%
    (zones 2, 3A, 3B), severe >100% to ~116% (4, 5), extreme >116% (6, 7). His
    zone 2 (80-88%) is heavy by that statement while it computes as Endurance
    here; the table flags it as touching the LT1 band, where the domain depends
    on the athlete.

zones:
  - key: 1A
    name: Post Interval Recovery
    ranges:
      power: {min: 50, max: 65}
    rpe: {min: 1, max: 2}

  - key: 1B
    name: EZ Warm-Up
    ranges:
      power: {min: 65, max: 75}
    rpe: {min: 2, max: 2}

  - key: 1C
    name: EZ Aerobic Running
    ranges:
      power: {min: 75, max: 80}
    rpe: {min: 2, max: 3}

  - key: "2"
    name: Endurance / Long Run
    ranges:
      power: {min: 80, max: 88}
    rpe: {min: 3, max: 4}

  - key: 3A
    name: Extensive Threshold Stimulus
    stated_class:
      class: sub_threshold
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 3A "Extensive Threshold Stimulus" — "sweet spot running".
    resolution:
      use: stated
      reason: >-
        88–95% has its midpoint (91.5) exactly on the running tempo/sub-threshold boundary; Palladino states the zone's purpose as the sweet-spot threshold stimulus.
    ranges:
      power: {min: 88, max: 95}
    rpe: {min: 4, max: 5}

  - key: 3B
    name: Intensive Threshold Stimulus
    stated_class:
      class: threshold
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 3B "Intensive Threshold Stimulus".
    ranges:
      power: {min: 95, max: 101}
    rpe: {min: 5, max: 6}

  - key: "4"
    name: Supra Threshold
    stated_class:
      class: supra_threshold
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 4 "Supra-Threshold" — above CP/FTP, severe domain.
    ranges:
      power: {min: 101, max: 106}
    rpe: {min: 7, max: 8}

  - key: "5"
    name: Maximal Aerobic Power
    stated_class:
      class: vo2max
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 5 "Maximal Aerobic Power" — VO2max stimulus range.
    ranges:
      power: {min: 106, max: 116}
    rpe: {min: 8, max: 9}

  - key: "6"
    name: Anaerobic Power
    stated_class:
      class: anaerobic
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 6 "Anaerobic Power Stimulus" — extreme domain.
    ranges:
      power: {min: 116, max: 150}
    rpe: {min: 9, max: 10}

  - key: "7"
    name: Sprint / Maximal Power
    stated_class:
      class: neuromuscular
      source: >-
        Palladino, Running with Power — zone table, stimulus column: 7 "Sprint / Maximal Power".
    ranges:
      power: {min: 150, max: null}
    rpe: {min: 10, max: 10}

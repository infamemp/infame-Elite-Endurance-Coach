# Olbrich Running Zones
# Conforms to config/schema/author.schema.json
# Migrated from Training_Zones/Simple_Table_Running_Training_Zones.md (v5.1)

id: olbrich
name: Olbrich Running Zones
sport: running
sport_note: Ultramarathon / Running

zone_identifier_style: Descriptive name (no native code; codes below derived for schema consistency)

default_metric: lthr
available_metrics: [hrmax]
primary_metrics:
  - Maximum Heart Rate (HRmax)
intensity_anchors: ["% HRmax"]

metric_status:
  hrmax: native

# Where threshold sits on Olbrich's own HRmax scale. Used to convert his native
# % HRmax to % LTHR (ratio, not offset).
hrmax_threshold_pct:
  value: 90
  source: >-
    Ultramarathon Training (2012): tempo endurance run 85-90% HRmax for
    "threshold development" (Ch. 17.2); intervals "usually above the anaerobic
    threshold (>= 90% of max)" (Ch. 6.2.5).

special_output_rule:
  native_metric: hrmax
  output_metric: lthr
  rationale: per Olbrich Exception

notes:
  - >-
    Source: Wolfgang Olbrich, "Ultramarathon Training" (2012), Ch. 17.2 zone
    table. Olbrich is a German Athletics Federation licensed high-performance
    running coach; the methodology targets 100 km, 24-hour and multi-day racing,
    not shorter road distances.
  - >-
    The book defines zones in % HRmax only. The % LTHR column is computed from
    it with the author's own threshold point (90% HRmax, see
    hrmax_threshold_pct), which is why the Special Output Rule exists: HRmax is
    native but cannot be emitted, so syntax uses the estimated % LTHR.
  - >-
    Olbrich prefers heart rate over pace outright, on the grounds that terrain,
    temperature and weather change daily while heart rate does not lie.
  - >-
    The book carries an internal discrepancy on the long recovery jog: Ch. 6
    gives 65-70% HRmax, Ch. 17.2 gives under 70%. The Ch. 17.2 value is used
    here as the plan-execution figure, per the knowledge base.
  - >-
    The gap between 70% and 75% HRmax is in the source: no zone covers it. Left
    as the author has it rather than closed artificially.

zones:
  - key: LRJ
    name: Long recovery jog
    ranges:
      hrmax: {min: null, max: 70}
    rpe: {min: 1, max: 2}

  - key: EER
    name: Extensive endurance run
    ranges:
      hrmax: {min: 75, max: 80}
    rpe: {min: 2, max: 3}

  - key: IER
    name: Intensive endurance run
    ranges:
      hrmax: {min: 80, max: 85}
    rpe: {min: 4, max: 5}

  - key: TER
    name: Tempo endurance run
    stated_class:
      class: threshold
      source: >-
        Olbrich, Ultramarathon Training (2012), Ch. 17.2: tempo endurance run — goal "threshold development".
    resolution:
      use: stated
      reason: >-
        The zone ends exactly at the author's own threshold (90% HRmax = 100%
        LTHR) and is prescribed as one continuous run for threshold
        development. A heart-rate target for a sustained threshold run sits
        just below LTHR because heart rate drifts upward over the effort, so the
        heart-rate midpoint reads slightly low on the threshold scale.
    ranges:
      hrmax: {min: 85, max: 90}
    rpe: {min: 6, max: 7}

  - key: INT
    name: Interval
    stated_class:
      class: vo2max
      source: >-
        Olbrich, Ultramarathon Training (2012), Ch. 6.2.5: intervals "very intensive, usually above the anaerobic threshold".
    resolution:
      use: stated
      reason: >-
        The zone is heart-rate native (> 90% HRmax) with an open upper bound that begins exactly at the author's threshold, so its lower bound alone computes as Threshold. Olbrich places it above the anaerobic threshold, 200 m–5 km repeats — the severe domain; heart rate cannot separate supra-threshold from VO2max there.
    ranges:
      hrmax: {min: 90, max: null}
    rpe: {min: 8, max: 10}

  - key: FAR
    name: Fartlek
    ranges:
      hrmax: {min: 70, max: 90}
    rpe: {min: 2, max: 7}
    note: Variable effort by design

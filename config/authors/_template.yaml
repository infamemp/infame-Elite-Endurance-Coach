# TEMPLATE — copy this file to config/authors/<your_id>.yaml and fill it in.
# Files starting with "_" are skipped by the loader.
# After editing: python build_zone_tables.py validate  →  python build_zone_tables.py build
#
# Full field reference: config/schema/author.schema.json
#
# ══════════════════════════════════════════════════════════════════
# THE ONE RULE (v7.2): write ONLY what the author publishes.
# ══════════════════════════════════════════════════════════════════
# - The author's own numbers (native ranges), exactly as printed in the book.
# - The author's own RPE.
# - Where the author explicitly names a zone's physiological target
#   ("Lactate Threshold", "VO2max", "aerobic base"), that target as
#   `stated_class`, with the page or table it comes from.
#
# Do NOT type:
# - estimates for metrics the author does not publish (pace, % LTHR, power…)
# - a physiological class or a domain
# All of that is computed by zone_model.py through config/crosswalk.yaml and
# config/tss_classes.yaml, the same way for every author. If the class computed
# from the numbers disagrees with the author's stated target, `validate` fails and
# tells you which zone; you then record a `resolution` (see the zone example).

# Machine identifier. Lowercase, digits and underscores only.
# MUST match the filename stem exactly. Never change it once in use.
id: your_id

# Display name, as it appears in the generated Markdown heading.
name: Author Name Zones

# cycling | running
sport: running

# Optional. Use when the sport label alone is imprecise, e.g. "Ultrarunning / Running".
# sport_note: Ultrarunning / Running

# How this author names zones, in their own vocabulary.
zone_identifier_style: Zone N

# Metric used when the athlete declares no preference. It may be a metric the
# author does not publish (it will then use the estimated column).
# One of: power | lthr | pace | hrmax | rpe   (pace is running only)
default_metric: pace

# The metrics the author PUBLISHES numbers for (plus `rpe` if RPE is the author's
# primary scale). Cycling: power, lthr, hrmax. Running: pace, lthr, power, hrmax.
# Every other metric of the sport is estimated at build time.
available_metrics: [pace]

# Human-readable physiological references shown in the generated header.
primary_metrics:
  - Lactate Threshold (LT) Pace

# Optional. How anchors are displayed. Defaults to available_metrics when omitted.
# intensity_anchors: ["% Threshold Pace"]

metric_status:
  pace: native

# ── Optional: author publishes % HRmax ────────────────────────────
# Where threshold sits on the author's own HRmax scale, when the author states it
# (e.g. "threshold ≈ 90% HRmax"). Converts % HRmax → % LTHR. Omit to use the
# crosswalk default. Never estimate it yourself.
# hrmax_threshold_pct:
#   value: 90
#   source: Book title, chapter/table where the author states it.

# ── Optional: non-threshold anchor ────────────────────────────────
# Use ONLY when the author's percentages are of something other than threshold
# (worked example: Carmichael's CTS Field Test, 10% above threshold).
# anchor:
#   metric: power
#   reference: What the author's 100% is, in words
#   factor_from_threshold: 1.10
#   source: Where the book states the factor. Never an estimate.
#   equivalent_column_label: "% FTP (equivalent)"

# ── Optional: dual-layer ──────────────────────────────────────────
# Use ONLY when the athlete-facing cue metric differs from the engine-facing load metric.
# Worked example: Koop (engine = % LTHR for platform load, steering = RPE per workout code).
# dual_layer:
#   required: true
#   engine_metric: lthr
#   steering_metric: rpe

# ── Optional: special output rule ─────────────────────────────────
# Use ONLY when the native intensity metric must NOT be the metric emitted in syntax.
# Worked example: Olbrich (native % HRmax, output forced to estimated % LTHR).
# special_output_rule:
#   native_metric: hrmax
#   output_metric: lthr
#   rationale: Per the Olbrich Exception.

# Author-level notes. Rendered as bullet lines. Use for deliberate zone gaps,
# metric equivalences, or field-test pointers.
notes:
  - Replace or delete this line.

# ── Zones ─────────────────────────────────────────────────────────
# List in ascending intensity order.
#
# Range notation (native values only):
#   {min: 55, max: 74}     → 55–74%
#   {min: null, max: 55}   → < 55%
#   {min: 150, max: null}  → > 150%
#   omit the metric entirely → estimated at build time (or N/A)
#
# stated_class — ONLY when the author explicitly names the physiological target.
#   recovery | endurance | tempo | sub_threshold | threshold | supra_threshold
#   | vo2max | anaerobic | neuromuscular
#   Do not derive it from a workout name ("Tempo" as a session name is not a
#   physiological claim). Required when the zone has no numbers at all.
zones:
  - key: Zone 1
    name: Recovery
    stated_class:
      class: recovery
      source: Book title, table/chapter — the author's words.
    ranges:
      pace: {min: null, max: 78}
    rpe: {min: 1, max: 2}

  - key: Zone 4
    name: Threshold
    stated_class:
      class: threshold
      source: Book title, table/chapter — the author's words.
    # Only if `validate` reports that the numbers compute a different class:
    # resolution:
    #   use: stated        # or: computed
    #   reason: Why the author's statement (or the numbers) governs here.
    ranges:
      pace: {min: 95, max: 101}
    rpe: {min: 6, max: 7}
    note: Row-level notes are optional.

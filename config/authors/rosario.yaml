# Rosario / Fitzgerald Running Intensities
# Conforms to config/schema/author.schema.json (v7.2 — native values + race anchors)
# Source: Matt Fitzgerald & Ben Rosario, "Run Like a Pro (Even If You're Slow)"
# (2022), Ch. 4 ("Training Plans Overview"), extracted via the book-processing
# pipeline (run-like-a-pro-matt-fitzgerald_kb.md, sections QR-1 to QR-5, T-1 to T-3).

id: rosario
name: Rosario / Fitzgerald Running Intensities
sport: running
sport_note: Road running (5K to marathon and ultramarathon)

zone_identifier_style: Named intensity, anchored to sustainable duration or race distance rather than zone number

default_metric: lthr
available_metrics: [hrmax]
primary_metrics:
  - Maximum Heart Rate (HRmax)
  - Ventilatory Threshold reference points (VT1, VT2)
intensity_anchors: ["% HRmax", "race pace / sustainable duration"]

metric_status:
  hrmax: native

special_output_rule:
  native_metric: hrmax
  output_metric: lthr
  rationale: per the Olbrich Exception (native % HRmax is never emitted in syntax)

notes:
  - >-
    This author defines intensity almost entirely by a SUSTAINABLE DURATION or
    a RACE DISTANCE (the fastest pace held for 6 min, 30 min, 1 h or 2 h; goal
    marathon, half-marathon, 10K or 5K pace), not by a percentage table. Only
    two points carry a native number: VT1 (77-81% HRmax, the moderate/heavy
    boundary, QR-2) and VT2 (91-93% HRmax, the heavy/severe boundary, QR-3).
    Every other zone declares a `race_anchor`; its range comes from
    config/crosswalk.yaml (distances: Palladino's published Table 2; durations:
    the Daniels-Gilbert model, +/- 2 points) and its class is computed from that
    range, not assigned. All of those values are estimates and carry `~`.
  - >-
    Threshold on this author's HRmax scale: no value is declared, so the
    crosswalk default applies (90% HRmax = 100% LTHR, from Daniels T = 88-92%
    and Olbrich threshold = 85-90%). With it, the author's VT2 (91-93% HRmax)
    computes to about 101-105% of threshold pace, which agrees with the
    30-minute critical-velocity anchor (103.8%); the zone table shows both are
    consistent (CV row).
  - >-
    The author places time to exhaustion at critical velocity at 20-30 minutes
    (QR-3), shorter than the ~40-50 minutes Palladino gives for FTP/CP. Both
    are inside the 30-70 minute band in which authors place threshold; see
    `threshold_definition` in config/crosswalk.yaml. Rosario's CV therefore
    reads a little above threshold (Supra-threshold) where a 60-minute
    definition would read it at threshold.
  - >-
    Population reference from the same source (QR-4/QR-5): ~80% of training
    time below VT1 (below ~82% HRmax) and ~20% at moderate+high combined,
    applied on weekly/monthly/yearly timescales — a training distribution, not
    a zone, so it is not a row here.
  - >-
    T-1/T-2/T-3 give three field tests to locate VT1/VT2 without a lab: a
    6-minute all-out test (pace x0.65 = VT1), an HRmax test, and the Talk Test.

zones:
  - key: Easy
    name: Easy
    stated_class:
      class: endurance
      source: >-
        Run Like a Pro, QR-1: "at or below VT1 pace/HR/power" — by definition
        the top of the moderate domain.
    resolution:
      use: stated
      reason: >-
        The author's "Easy" is one open-ended zone from the prescription floor
        up to VT1, so it covers both what other authors call recovery and
        endurance. Its midpoint (about 64% of threshold) falls in the Recovery
        band and would read the whole zone as recovery. The author names it the
        ordinary aerobic-base run at or below VT1, so the stated class governs.
        Recovery is not a separate zone in this author's model.
    ranges:
      hrmax: {min: null, max: 81}
    rpe: {min: 1, max: 4}
    note: >-
      Upper bound is the top of the author's own VT1 range (77-81% HRmax,
      "fitter runners are nearer the top"). VT1 is rated RPE 4 (QR-2).

  - key: MP
    name: Marathon Pace (MP)
    race_anchor:
      distance: marathon
      source: "Run Like a Pro, QR-1: current or goal marathon race pace."
    ranges: {}

  - key: SSP
    name: Steady-State Pace (SSP)
    race_anchor:
      duration_min: 120
      source: "Run Like a Pro, QR-1: fastest pace sustainable for 2 hours."
    ranges: {}

  - key: HMP
    name: Half-Marathon Pace (HMP)
    race_anchor:
      distance: half_marathon
      source: "Run Like a Pro, QR-1: current or goal half-marathon race pace."
    ranges: {}

  - key: LTP
    name: Lactate-Threshold Pace (LTP)
    stated_class:
      class: threshold
      source: >-
        Run Like a Pro, QR-1: "fastest pace sustainable for 1 hour" — the
        author's own definition of lactate-threshold pace.
    race_anchor:
      duration_min: 60
      source: "Run Like a Pro, QR-1: fastest pace sustainable for 1 hour."
    ranges: {}

  - key: 10KP
    name: 10K Pace (10KP)
    race_anchor:
      distance: 10K
      source: "Run Like a Pro, QR-1: current or goal 10K race pace."
    ranges: {}

  - key: CV
    name: Critical Velocity (CV)
    race_anchor:
      duration_min: 30
      source: >-
        Run Like a Pro, QR-1: "fastest pace sustainable for 30 minutes."
        Used as a consistency check against the native VT2 heart rate below.
    ranges:
      hrmax: {min: 91, max: 93}
    note: >-
      The author states CV aligns closely with VT2 (91-93% HRmax) and that
      running to exhaustion at CV usually lasts 20-30 minutes (QR-3).

  - key: HI
    name: High Intensity (HI)
    race_anchor:
      from: {duration_min: 30}
      to: {duration_min: 6}
      source: "Run Like a Pro, QR-1: the range between CV and MAS."
    ranges: {}

  - key: 5KP
    name: 5K Pace (5KP)
    race_anchor:
      distance: 5K
      source: "Run Like a Pro, QR-1: current or goal 5K race pace."
    ranges: {}

  - key: MAS
    name: Maximum Aerobic Speed (MAS)
    stated_class:
      class: vo2max
      source: >-
        Run Like a Pro, QR-1: "fastest pace sustainable for 6 minutes" — by
        definition the speed at VO2max.
    resolution:
      use: stated
      reason: >-
        A 6-minute effort computes to about 116% of threshold pace, one point
        above the running VO2max/Anaerobic boundary (115%), so the numbers alone
        would call it Anaerobic. MAS is by definition the speed at VO2max, and
        6 minutes is the classic VO2max interval length, so the stated class
        governs. The margin is about one point: the 114-118% range straddles
        the boundary.
    race_anchor:
      duration_min: 6
      source: "Run Like a Pro, QR-1: fastest pace sustainable for 6 minutes."
    ranges: {}

  - key: VHI
    name: Very-High Intensity (VHI)
    race_anchor:
      from: {duration_min: 6}
      to: null
      source: "Run Like a Pro, QR-1: the range between MAS and a full sprint."
    ranges: {}

# Friel Cycling Zones
# Conforms to config/schema/author.schema.json
# Migrated from Training_Zones/Simple_Table_Cycling_Training_Zones.md (v5.1)

id: friel_cycling
name: Friel Cycling Zones

# Knowledge base the coach reads for this methodology (path relative to Knowledge/).
knowledge_file: Joe_Friel_cyclists_training_bible_knowledge_base.md
sport: cycling

zone_identifier_style: Zone N (with sub-zone letters, e.g. "Zone 5 / 5a")

default_metric: power
available_metrics: [power, lthr]
primary_metrics:
  - Power
  - Functional Threshold Heart Rate (LTHR)
intensity_anchors: ["% FTP", "% LTHR"]

metric_status:
  power: native
  lthr: native

notes:
  - FTHR = LTHR. Output as % LTHR in all Intervals.icu syntax.

zones:
  - key: Zone 1
    name: Active Recovery
    stated_class:
      class: recovery
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Active Recovery".
    ranges:
      power: {min: null, max: 55}
      lthr:  {min: null, max: 81}
    rpe: {min: 1, max: 2}

  - key: Zone 2
    name: Endurance
    stated_class:
      class: endurance
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Endurance".
    ranges:
      power: {min: 55, max: 74}
      lthr:  {min: 82, max: 89}
    rpe: {min: 3, max: 4}

  - key: Zone 3
    name: Tempo
    stated_class:
      class: tempo
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Tempo".
    ranges:
      power: {min: 75, max: 89}
      lthr:  {min: 90, max: 93}
    rpe: {min: 5, max: 6}

  - key: Zone 4
    name: Lactate Threshold
    stated_class:
      class: threshold
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Lactate Threshold".
    ranges:
      power: {min: 90, max: 104}
      lthr:  {min: 94, max: 99}
    rpe: {min: 7, max: 7}

  - key: Zone 5 / 5a
    name: VO2max / Threshold Aerobic
    stated_class:
      class: vo2max
      source: >-
        Friel, The Cyclist's Training Bible — zone named "VO2max".
    ranges:
      power: {min: 105, max: 120}
      lthr:  {min: 100, max: 102}
    rpe: {min: 8, max: 8}

  - key: Zone 6 / 5b
    name: Anaerobic Capacity
    stated_class:
      class: anaerobic
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Anaerobic Capacity".
    ranges:
      power: {min: 121, max: 150}
      lthr:  {min: 103, max: 106}
    rpe: {min: 9, max: 9}

  - key: Zone 7 / 5c
    name: Neuromuscular Power
    stated_class:
      class: neuromuscular
      source: >-
        Friel, The Cyclist's Training Bible — zone named "Neuromuscular Power".
    ranges:
      power: {min: 150, max: null}
      lthr:  {min: 107, max: null}
    rpe: {min: 10, max: 10}

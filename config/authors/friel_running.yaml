# Friel Running Zones
# Conforms to config/schema/author.schema.json
# Migrated from Training_Zones/Simple_Table_Running_Training_Zones.md (v5.1)

id: friel_running
name: Friel Running Zones
sport: running

zone_identifier_style: Zone N (with sub-zone letters, e.g. "Zone 5a")

default_metric: pace
available_metrics: [pace, lthr]
primary_metrics:
  - Lactate Threshold (LT) Pace
  - Lactate Threshold Heart Rate (LTHR)
intensity_anchors: ["% Threshold Pace", "% LTHR"]

metric_status:
  pace: native
  lthr: native

zones:
  - key: Zone 1
    name: Active Recovery
    physiological_class: recovery
    ranges:
      pace: {min: null, max: 78}
      lthr: {min: null, max: 85}
    rpe: {min: 1, max: 1}

  - key: Zone 2
    name: Endurance
    physiological_class: endurance
    ranges:
      pace: {min: 78, max: 88}
      lthr: {min: 85, max: 89}
    rpe: {min: 2, max: 3}

  - key: Zone 3
    name: Tempo
    physiological_class: tempo
    ranges:
      pace: {min: 88, max: 94}
      lthr: {min: 90, max: 94}
    rpe: {min: 4, max: 5}

  - key: Zone 4
    name: Lactate Threshold
    physiological_class: threshold
    ranges:
      pace: {min: 95, max: 101}
      lthr: {min: 95, max: 99}
    rpe: {min: 6, max: 7}

  - key: Zone 5a
    name: Sub-Aerobic Threshold
    physiological_class: vo2max
    ranges:
      pace: {min: 100, max: 103}
      lthr: {min: 100, max: 102}
    rpe: {min: 8, max: 8}

  - key: Zone 5b
    name: Aerobic Capacity / VO2max
    physiological_class: vo2max
    ranges:
      pace: {min: 104, max: 111}
      lthr: {min: 103, max: 106}
    rpe: {min: 9, max: 9}

  - key: Zone 5c
    name: Anaerobic Capacity
    physiological_class: anaerobic
    ranges:
      pace: {min: 111, max: null}
    rpe: {min: 10, max: 10}

# Koop Running Workout Zones
# Conforms to config/schema/author.schema.json
# Migrated from Training_Zones/Simple_Table_Running_Training_Zones.md (v5.1)

id: koop
name: Koop Running Workout Zones
sport: running
sport_note: Ultrarunning / Running

zone_identifier_style: Letter code (workout code)

default_metric: rpe
default_metric_label: RPE (workout-code specific)
available_metrics: [rpe]
primary_metrics:
  - Perceived Exertion
  - Physiological Adaptation Target
intensity_anchors: ["RPE"]

# v7.2: Koop publishes no pace, heart-rate or power numbers — only RPE and the
# physiological target of each workout code. The class of each zone therefore
# comes from that stated target, and every numeric column (pace, % LTHR, power)
# is the class band estimated through config/crosswalk.yaml.

notes:
  - >-
    Koop also states each workout code as a fraction of VO2max (ER ~50-65%,
    SSR ~65-75%, TR ~75-85%, RI >= 90%). There is no %VO2max column in the
    standard tables, so those figures stay in his knowledge base.
  - >-
    Koop's RPE scale runs higher than the standard reference (RecoveryRun 4-5,
    EnduranceRun 5-6). His RPE is what is emitted; the difference is reported
    by the build as a warning, not corrected.

dual_layer:
  required: true
  engine_metric: lthr
  steering_metric: rpe
  steering_label: RPE per workout code
  note: RPE per workout code is what the athlete reads on the device; % LTHR feeds the platform load calculation.

zones:
  - key: RR
    name: RecoveryRun
    stated_class:
      class: recovery
      source: >-
        Koop, Training Essentials for Ultrarunning — intensity table, physiological target: Active recovery.
    ranges: {}
    rpe: {min: 4, max: 5}
    note: "Physiological target: Active Recovery"

  - key: ER
    name: EnduranceRun
    stated_class:
      class: endurance
      source: >-
        Koop, Training Essentials for Ultrarunning — intensity table, physiological target: Aerobic base; predominantly fat oxidation; ~50–65% VO2max.
    ranges: {}
    rpe: {min: 5, max: 6}
    note: "Physiological target: Aerobic Endurance / \"Forever\" Pace"

  - key: SSR
    name: SteadyStateRun
    stated_class:
      class: sub_threshold
      source: >-
        Koop, Training Essentials for Ultrarunning — intensity table, physiological target: High aerobic; below lactate threshold; ~65–75% VO2max; 20–60 min continuous intervals.
    ranges: {}
    rpe: {min: 7, max: 8}
    note: "Physiological target: High-End Aerobic"

  - key: TR
    name: TempoRun
    stated_class:
      class: threshold
      source: >-
        Koop, Training Essentials for Ultrarunning — intensity table, physiological target: At or near lactate threshold; ~75–85% VO2max; all-out time-trial pace for 40–90 min.
    ranges: {}
    rpe: {min: 8, max: 9}
    note: "Physiological target: Lactate Threshold"

  - key: RI
    name: RunningIntervals
    stated_class:
      class: vo2max
      source: >-
        Koop, Training Essentials for Ultrarunning — intensity table, physiological target: VO2max intensity; >= 90% VO2max.
    ranges: {}
    rpe: {min: 9, max: 10}
    note: "Physiological target: VO2 Max"

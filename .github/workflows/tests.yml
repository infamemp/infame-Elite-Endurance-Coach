# Runs both test suites on every push and pull request (v7.32).
# A red cross next to a commit on GitHub means a test failed: read the log of
# the "tests" run before building on that commit.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt "mcp==1.30.0"
      - name: Engine, validator and prompt tests
        run: python tests/run_tests.py
      - name: MCP server tests
        run: python tests/test_mcp_server.py
